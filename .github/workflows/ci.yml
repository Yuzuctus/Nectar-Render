name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p nectar-app -p nectar-cli
      - name: Export de la démo
        run: target/release/nectar.exe export "examples/coffre-demo/Démo Nectar.md" -o demo.pdf --system-fonts
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-render-windows
          path: |
            target/release/nectar-render.exe
            target/release/nectar.exe
            demo.pdf
