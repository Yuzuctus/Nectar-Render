name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p nectar-app -p nectar-cli
      - name: Export de la démo
        run: target/release/nectar.exe export "examples/coffre-demo/Démo Nectar.md" -o demo.pdf --system-fonts
      - name: Plugin Obsidian
        working-directory: obsidian-plugin
        run: |
          npm ci
          npm run build
      - name: Dossier à tester
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force essai/plugin-obsidian/nectar-render | Out-Null
          Copy-Item target/release/nectar-render.exe, target/release/nectar.exe essai/
          Copy-Item demo.pdf "essai/Démo Nectar (export).pdf"
          Copy-Item -Recurse examples/coffre-demo essai/coffre-demo
          Copy-Item obsidian-plugin/main.js, obsidian-plugin/manifest.json essai/plugin-obsidian/nectar-render/
          Copy-Item packaging/windows/LISEZ-MOI.txt essai/
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-render-windows
          path: essai/
          include-hidden-files: true

  plugin-obsidian:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
